services:
  navigation:
    build: .
    image: tenax-navigation:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - navigation-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25

volumes:
  navigation-data:
